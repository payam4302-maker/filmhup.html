<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Hop - کامل</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #0f2027; color: #fff; min-height: 100vh; }

        /* صفحه اصلی */
        #main-menu { padding: 20px; }
        .menu-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 800px; margin: 0 auto; }
        .card-btn {
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px; padding: 15px; text-align: center; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }
        .card-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); border-color: #f093fb; }

        /* محتوای داخلی */
        #content-area { display: none; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        header h1 { font-size: 22px; background: linear-gradient(45deg, #ff6b6b, #f093fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .search-box input { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 8px 15px; color: #fff; outline: none; }
        .search-box input:focus { border-color: #667eea; }

        .category-icon-grid {
            display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center;
        }
        .category-icon {
            width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; color: #fff; cursor: pointer; transition: 0.3s;
            border: 2px solid rgba(255,255,255,0.2); position: relative;
        }
        .category-icon:hover { transform: scale(1.1); border-color: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .category-icon .tooltip {
            position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff; padding: 4px 10px; border-radius: 6px;
            font-size: 12px; white-space: nowrap; opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .category-icon:hover .tooltip { opacity: 1; visibility: visible; bottom: -35px; }

        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .movie-card {
            position: relative; aspect-ratio: 2/3; border-radius: 10px; overflow: hidden;
            cursor: pointer; background: #000; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .movie-card img { width: 100%; height: 100%; object-fit: cover; }
        .movie-card .info { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); }
        .movie-card .info h3 { font-size: 14px; }
        .movie-card .info p { font-size: 12px; color: #ddd; }

        /* پاپ‌آپ جنسیت */
        .gender-popup {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center; z-index: 5000;
        }
        .gender-popup.active { display: flex; }
        .gender-popup-content {
            background: #1a2a3a; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px; padding: 40px; text-align: center; max-width: 400px; width: 90%;
        }
        .gender-popup-content h2 { font-size: 24px; margin-bottom: 30px; }
        .gender-popup-content button {
            padding: 15px 40px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05); color: #fff; border-radius: 50px;
            font-size: 16px; cursor: pointer; margin: 0 10px; transition: 0.3s;
        }
        .gender-popup-content button:hover { background: rgba(255,255,255,0.15); transform: translateY(-3px); }

        /* صفحه پخش فیلم */
        #video-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f2027; z-index: 3000; display: none; flex-direction: column;
        }
        #video-page.active { display: flex; }
        .video-header { padding: 15px; display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.5); }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .video-container { width: 100%; background: #000; }
        .video-container video { width: 100%; height: auto; aspect-ratio: 16/9; }
        .video-info { padding: 20px; }
        .video-info h2 { font-size: 22px; color: #667eea; }
        .video-info p { color: #ccc; margin-top: 10px; }

        /* چت آنلاین */
        .chat-section {
            background: #111b21; flex: 1; display: flex; flex-direction: column;
            border-top: 1px solid #2a3942;
        }
        .chat-header {
            padding: 10px 15px; background: #202c33; border-bottom: 1px solid #2a3942;
            display: flex; align-items: center; gap: 10px;
        }
        .chat-header h3 { font-size: 16px; color: #fff; }
        .online-indicator { width: 8px; height: 8px; background: #00e676; border-radius: 50%; box-shadow: 0 0 5px #00e676; }
        .chat-header span { font-size: 12px; color: #00e676; }

        .chat-messages {
            flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .message {
            max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }
        .message.received { background: #202c33; color: #e9edef; align-self: flex-start; border-bottom-right-radius: 0; border: 1px solid #2a3942; }
        .message.sent { background: #005c4b; color: #e9edef; align-self: flex-end; border-bottom-left-radius: 0; border: 1px solid #004d3e; }
        .message-meta { display: flex; justify-content: flex-end; align-items: center; gap: 5px; font-size: 10px; color: #8696a0; margin-top: 4px; }
        .message.received .message-meta { justify-content: flex-start; }

        .chat-input-area { padding: 10px; background: #202c33; display: flex; gap: 10px; align-items: center; }
        .chat-input { flex: 1; background: #2a3942; border: none; border-radius: 20px; padding: 10px 15px; color: #fff; outline: none; font-size: 14px; }
        .send-btn { background: #00a884; border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .send-btn:hover { background: #00c39a; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .menu-grid { grid-template-columns: repeat(3, 1fr); }
            .category-grid { grid-template-columns: repeat(2, 1fr); }
            .category-icon { width: 50px; height: 50px; font-size: 20px; }
        }
    </style>
</head>
<body>

    <!-- پاپ‌آپ جنسیت -->
    <div id="genderPopup" class="gender-popup">
        <div class="gender-popup-content">
            <h2>لطفاً جنسیت خود را انتخاب کنید</h2>
            <button onclick="selectGender('male')">مرد</button>
            <button onclick="selectGender('female')">زن</button>
        </div>
    </div>

    <!-- صفحه اصلی -->
    <div id="main-menu">
        <div class="menu-grid" id="cardsContainer"></div>
    </div>

    <!-- محتوای داخلی -->
    <div id="content-area">
        <header>
            <h1 id="sectionTitle">عنوان بخش</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="جستجو (مثلا: بخش 50 یا نام فیلم)..." oninput="searchMovies()">
            </div>
        </header>
        <div class="category-icon-grid" id="categoryIcons"></div>
        <div id="galleryContainer"></div>
    </div>

    <!-- صفحه پخش فیلم -->
    <div id="video-page">
        <div class="video-header">
            <button class="back-btn" onclick="goBack()">←</button>
            <span style="font-weight: bold;">پخش فیلم</span>
        </div>
        <div class="video-container">
            <video id="mainVideo" controls>
                <source src="" type="video/mp4">
            </video>
        </div>
        <div class="video-info">
            <h2 id="modalTitle">عنوان فیلم</h2>
            <p id="modalDesc">توضیحات</p>
        </div>
        
        <!-- چت آنلاین -->
        <div class="chat-section">
            <div class="chat-header">
                <div class="online-indicator"></div>
                <h3>گفتگوی زنده</h3>
                <span>۱۲ نفر آنلاین</span>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chatInput" placeholder="پیام خود را بنویسید..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const sectionNames = ["اکشن", "کمدی", "درام", "ترسناک", "علمی تخیلی", "مستند", "انیمیشن", "کلاسیک", "سریال", "جدیدترین‌ها"];
        const userNames = ["علی", "سارا", "امیر", "مریم", "رضا", "زهرا", "نرگس", "حسین"];
        const responses = ["آره موافقم!", "جالب بود.", "نظر دیگه‌ای داری؟", "دقیقاً!", "خوب بود.", "منم همینطور!", "نه، به نظر من بد بود.", "بازیگرش عالی بود."];
        const categoryColors = ['#e74c3c','#f39c12','#9b59b6','#2c3e50','#3498db','#27ae60','#e91e63','#795548','#00bcd4','#ff5722'];

        let userGender = null;
        let pendingFilm = null;
        let currentSectionIndex = null;
        let currentCategoryIndex = 0;
        let chatMessages = [];

        function generateFilms(count) {
            const films = [];
            for (let i = 1; i <= count; i++) {
                const year = 1380 + Math.floor(Math.random() * 24);
                const seed = i + Math.floor(Math.random() * 1000);
                films.push({
                    title: `فیلم شماره ${i}`,
                    year: year,
                    img: `https://picsum.photos/seed/${seed}/400/600`,
                    video: "https://www.w3schools.com/html/mov_bbb.mp4",
                    desc: `این فیلم شماره ${i} در سال ${year} ساخته شده است.`
                });
            }
            return films;
        }

        const allSectionsData = [];
        for(let i=1; i<=100; i++) {
            const sectionData = [];
            for(let j=0; j<10; j++) {
                sectionData.push({ name: sectionNames[j], films: generateFilms(100) });
            }
            allSectionsData.push(sectionData);
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            for(let i=1; i<=10; i++) {
                const card = document.createElement('div');
                card.className = 'card-btn';
                card.textContent = i;
                card.onclick = () => loadSection(i-1);
                container.appendChild(card);
            }
        }

        function loadSection(index) {
            currentSectionIndex = index;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('content-area').style.display = 'block';
            document.getElementById('sectionTitle').textContent = `بخش ${index + 1}`;
            renderCategoryIcons(allSectionsData[index]);
            currentCategoryIndex = 0;
            renderGallery(allSectionsData[index], currentCategoryIndex);
        }

        function renderCategoryIcons(data) {
            const container = document.getElementById('categoryIcons');
            container.innerHTML = '';
            data.forEach((cat, index) => {
                const icon = document.createElement('div');
                icon.className = 'category-icon';
                icon.style.background = categoryColors[index % categoryColors.length];
                icon.textContent = cat.name[0];
                const tooltip = document.createElement('span');
                tooltip.className = 'tooltip';
                tooltip.textContent = cat.name;
                icon.appendChild(tooltip);
                icon.onclick = () => {
                    currentCategoryIndex = index;
                    renderGallery(data, index);
                };
                container.appendChild(icon);
            });
        }

        function renderGallery(data, categoryIndex) {
            const container = document.getElementById('galleryContainer');
            container.innerHTML = '';
            const cat = data[categoryIndex];
            const section = document.createElement('div');
            section.className = 'category-section';
            const title = document.createElement('div');
            title.className = 'category-title';
            title.textContent = cat.name;
            const grid = document.createElement('div');
            grid.className = 'category-grid';
            cat.films.forEach(film => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `<img src="${film.img}" alt="${film.title}"><div class="info"><h3>${film.title}</h3><p>${film.year}</p></div>`;
                card.onclick = () => showGenderPopup(film);
                grid.appendChild(card);
            });
            section.appendChild(title);
            section.appendChild(grid);
            container.appendChild(section);
        }

        function showGenderPopup(film) {
            pendingFilm = film;
            document.getElementById('genderPopup').classList.add('active');
        }

        function selectGender(gender) {
            userGender = gender;
            document.getElementById('genderPopup').classList.remove('active');
            if (pendingFilm) {
                openVideo(pendingFilm);
                pendingFilm = null;
            }
        }

        function openVideo(film) {
            document.getElementById('mainVideo').src = film.video;
            document.getElementById('modalTitle').textContent = film.title;
            document.getElementById('modalDesc').textContent = film.desc;
            document.getElementById('video-page').classList.add('active');
            document.getElementById('mainVideo').play();
            chatMessages = [
                { user: "علی", text: "سلام! فیلم خوبی بود؟", time: "10:30", sent: false },
                { user: "سارا", text: "آره عالی بود!", time: "10:31", sent: false },
                { user: "شما", text: "منم خوشم اومد", time: "10:32", sent: true }
            ];
            renderChat();
        }

        function goBack() {
            document.getElementById('video-page').classList.remove('active');
            document.getElementById('mainVideo').pause();
            document.getElementById('mainVideo').src = "";
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            const now = new Date();
            const time = now.getHours() + ':' + (now.getMinutes()<10?'0':'') + now.getMinutes();
            chatMessages.push({ user: "شما", text: text, time: time, sent: true });
            input.value = '';
            renderChat();
            setTimeout(() => {
                const randomUser = userNames[Math.floor(Math.random() * userNames.length)];
                const randomText = responses[Math.floor(Math.random() * responses.length)];
                const replyTime = new Date().getHours() + ':' + (new Date().getMinutes()<10?'0':'') + new Date().getMinutes();
                chatMessages.push({ user: randomUser, text: randomText, time: replyTime, sent: false });
                renderChat();
            }, 1500 + Math.random() * 2000);
        }

        function renderChat() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            chatMessages.slice(-50).forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.sent ? 'sent' : 'received'}`;
                div.innerHTML = `<div>${msg.text}</div><div class="message-meta">${!msg.sent ? `<span>${msg.user}</span>` : ''}<span>${msg.time}</span></div>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function searchMovies() {
            const input = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('galleryContainer');
            container.innerHTML = '';
            if (!input) { container.innerHTML = '<div style="text-align:center; padding:50px; color:#aaa;">لطفاً نام فیلم یا شماره بخش را جستجو کنید.</div>'; return; }
            if (input.startsWith('بخش')) {
                const match = input.match(/بخش\s+(\d+)/);
                if (match) {
                    const sectionNum = parseInt(match[1]);
                    if (sectionNum >= 1 && sectionNum <= 100) { loadSection(sectionNum - 1); return; }
                    else { container.innerHTML = '<div style="text-align:center; padding:50px; color:#aaa;">بخش مورد نظر وجود ندارد (۱ تا ۱۰۰).</div>'; return; }
                }
            }
            let found = false;
            for(let i=0; i<100; i++) {
                const sectionData = allSectionsData[i];
                sectionData.forEach((cat, catIndex) => {
                    const matchingFilms = cat.films.filter(f => f.title.toLowerCase().includes(input));
                    if (matchingFilms.length > 0) {
                        found = true;
                        const section = document.createElement('div');
                        section.className = 'category-section';
                        const title = document.createElement('div');
                        title.className = 'category-title';
                        title.textContent = `بخش ${i+1} - ${cat.name} (${matchingFilms.length} نتیجه)`;
                        const grid = document.createElement('div');
                        grid.className = 'category-grid';
                        matchingFilms.forEach(film => {
                            const card = document.createElement('div');
                            card.className = 'movie-card';
                            card.innerHTML = `<img src="${film.img}" alt="${film.title}"><div class="info"><h3>${film.title}</h3><p>${film.year}</p></div>`;
                            card.onclick = () => showGenderPopup(film);
                            grid.appendChild(card);
                        });
                        section.appendChild(title);
                        section.appendChild(grid);
                        container.appendChild(section);
                    }
                });
            }
            if (!found) container.innerHTML = '<div style="text-align:center; padding:50px; color:#aaa;">هیچ فیلمی پیدا نشد.</div>';
        }

        renderCards();
    </script>
</body>
</html>
